# P3-3：三平台 CI 矩阵。
#
# ## 为什么必须有
# 与 `cross-platform-plan.md` P1-5 是同一条：全仓测试此前**只在本机 macOS 跑过**。
# 没有矩阵，任何一处平台相关的修复（`ulimit` 单位、进程组 kill、路径分隔符、`sandbox-exec`
# 与 `bwrap` 的可用性、bash 语义差异）都会在下次改动里**静默回归** —— 沙箱那一批
# （P0-6 / P1-1 / P1-2 / P1-3）尤其如此：它们的判据本来就跟平台绑着。
#
# ## 三档口径
# - `ubuntu` / `macos`：**硬失败**（typecheck + 测试都必须过）。
# - `windows`：typecheck 硬失败（TS 是平台无关的，过不了就是真问题）；
#   测试允许"bash 语义差异"造成的失败不阻断，但**汇总数字照写 summary**，且
#   `pass` 阈值照样判 —— 防的是"全跳过/整包炸了还绿"，不是防少量回归。
# - 两个平台上都跑 `scripts/ci/test-summary.sh`：它负责记录跳过条数 + 阈值判定。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # 手动触发：P3-1 / P3-2 / P3-3 那批**只能在 Windows 上验**，需要一个"现在就跑一次"的入口
  # （否则每次都得造一个提交来触发 push 事件）
  workflow_dispatch:

# 同一分支连续推送时取消上一次 —— 矩阵三份跑起来不便宜
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # 本仓基线 bun 1.3.x（`bun --version` 实测 1.3.14）；跟 minor 不跟 latest，
          # 免得上游改 bun test 的汇总行格式把阈值判定打歪
          bun-version: "1.3.x"

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # typecheck 是平台无关的判据（除 `adapters/*` —— 它不在根 workspaces 里，另行处理）
      # 超时是**有界的失败**：卡住比慢更糟 —— 没有超时时 job 会一直挂到 GitHub 的 6 小时上限，
      # 期间既没有日志也没有结论（2026-10-13 实测：Windows 的测试步骤挂住 15 分钟+）。
      - name: typecheck
        timeout-minutes: 15
        run: bun run typecheck

      # Windows 上 shell 显式指定 bash：runner 默认是 pwsh，而脚本与
      # `bun run --filter '*'` 的输出解析（grep -oE）都是 POSIX 口径
      # ⚠️ 日志路径用**相对工作目录**，不要写 `/tmp`：
      # `bash` 步骤里的 `/tmp` 会被 MSYS 映射到别处，而 `upload-artifact`（Node 实现、不经 MSYS）
      # 看到的是字面 `/tmp/...` ⇒ **Windows 上 artifact 永远为空**（`if-no-files-found: ignore` 会静默跳过）
      # —— 而 Windows 恰恰是最需要那份日志的平台。相对路径两平台都明确。
      # ⚠️ 超时同样是为了**拿到证据**：步骤被超时杀掉之后，`if: always()` 的上传仍然执行
      # ⇒ artifact 里是"卡住那一刻为止"的日志 ⇒ 从最后一个开始的包就能定位卡点。
      - name: 测试（含汇总 / 阈值判定）
        # 40 分钟的来历：Windows 上改成**逐包**跑（见下面 PER_PKG_TIMEOUT）⇒ 不再并行，
        # 48 个包串行会明显长于 macOS/Linux 的 ~90s；留足空间，别让"慢"被误判成"挂"。
        timeout-minutes: 40
        shell: bash
        env:
          # 逐包 + 单包超时：**仅 Windows**（其它平台保持整轮 `bun run test`，语义不变）。
          # 240s 的来历：本机 macOS 上最慢的单包约 20s，Windows 慢一截但远小于此。
          # 一个包真挂住时只损失 4 分钟，且**其余包照常跑完**（实测：core 挂住曾让下游 22 个包
          # 一个都没跑到）—— 这才是这个开关的主要价值。
          PER_PKG_TIMEOUT: ${{ matrix.os == 'windows-latest' && 240 || 0 }}
        run: bash scripts/ci/test-summary.sh ./harness-ci-test.log "${{ runner.os }}"
        # 只有 Windows 允许非零退出（平台差异白名单，见文件头）；失败条数仍进 summary
        # ⚠️ 取舍：这一步会把 **Windows 的真回归也一起吞掉**（job 仍绿）。因此第一次跑通后，
        # 应当把 Windows 的 `continue-on-error` 收窄（或至少每次人工看 summary / artifact）。
        continue-on-error: ${{ matrix.os == 'windows-latest' }}

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: harness-ci-test.log
          if-no-files-found: warn
          retention-days: 7
